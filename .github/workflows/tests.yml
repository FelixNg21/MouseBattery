# Runs the test suite on a Windows machine for every push and pull request.
# Windows matters here: the registry tests in tests/test_startup.py only run there.
#
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest
